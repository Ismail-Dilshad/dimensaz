<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio · Tempoloom</title>
<link rel="stylesheet" href="/app.css">
<style>
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left}
.mode[aria-pressed=true]{border-color:var(--coral)}
.mode b{display:block;font-size:1.15rem;font-weight:600}
.form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:20px;align-items:start}
@media(max-width:860px){.form{grid-template-columns:1fr}.modes{grid-template-columns:1fr}}
textarea.big{min-height:190px}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.files{list-style:none;padding:0;margin:8px 0 0}
.files li{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-bottom:4px}
.files .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pickfile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors label{display:flex;gap:6px;align-items:center;font-size:.9rem}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.job{cursor:pointer}.job:hover{border-color:var(--dim)}
.prog{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--coral)}
.banner{border-radius:var(--r);padding:14px 16px;margin:14px 0;border:1px dashed var(--warn);background:var(--bg)}
.banner.you{border-style:solid;border-color:var(--coral)}
.banner code{color:var(--warn);font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
.step{margin-top:12px}
.step.todo{opacity:.55}
.out{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;max-height:340px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.out .ln{display:block;border-radius:6px;padding:1px 6px;margin:0 -6px;cursor:pointer}
.out .ln:hover{background:var(--raise)}.out .ln.flag{background:#4a1a12;outline:1px solid var(--bad)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.media figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.media figure.flag{border-color:var(--bad)}
.media img,.media video{display:block;width:100%;border-radius:6px;background:#000}
.media.wide{grid-template-columns:1fr}.media.wide video{max-height:60vh}
.media figcaption{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--dim);margin-top:6px}
.media figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
audio{width:100%}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.choice{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px}
.choice.picked{border-color:var(--good)}
.choice img,.choice video{display:block;width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:8px}
.ratebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn.g:hover,.btn.g.on{background:var(--good);border-color:var(--good);color:#06301a}
.btn.b:hover,.btn.b.on{background:var(--bad);border-color:var(--bad);color:#3a0e06}
.why{background:var(--bg);border:1px solid var(--bad);border-radius:10px;padding:12px;margin-top:10px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.parts{list-style:none;padding:0;margin:8px 0}
.parts li{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.parts .p{color:var(--bad);white-space:nowrap;font-size:.9rem;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;grid-template-columns:max-content 1fr max-content;gap:8px 12px;align-items:center}
.barx{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--bg)}
.barx i{display:block;height:100%}
</style>
</head>
<body>
<div class="wrap">
<header>
 <img src="/logo.svg" alt="Tempoloom">
 <div class="pages"><a id="pg-teach" href="/">Teach</a><a id="pg-studio" aria-current="page" href="/studio">Studio</a></div>
 <span class="tag">Make a video and rate every step</span>
 <div class="totals" id="totals"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<div id="alert"></div>
<main id="main"></main>
</div>
<script>
'use strict';
const KEY=new URLSearchParams(location.search).get('k')||'';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const withKey=u=>u+(u.includes('?')?'&':'?')+'k='+KEY;
$('#pg-teach').href=withKey('/');$('#pg-studio').href=withKey('/studio');
async function api(path,opt={}){
 const r=await fetch(path,{...opt,headers:{'x-teach-key':KEY,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}});
 const j=await r.json().catch(()=>({error:'The server did not answer'}));
 if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
const fmtT=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t-m*60);return m+':'+String(s).padStart(2,'0');};
const mb=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const LANGS=[['','Automatic'],['en','English'],['ckb','Kurdish (Sorani)'],['kmr','Kurdish (Kurmanji)'],['badini','Kurdish (Badini)'],['ar','Arabic'],['fa','Persian']];
let S=null,tab='new',openJob=null;
// The brief being written (kept while the page re-draws).
const blank=()=>({id:null,mode:'motion',text:'',script:false,link:'',seconds:'30',shape:'vertical',language:'',voice:false,captions:true,visuals:true,pick:true,useColors:false,primary:'#0B3B3C',accent:'#FF6B4A',background:'#FFF1D6',like:'',notes:'',files:[],busy:null,sending:false});
let N=blank();
// Rating forms being filled, by job|step.
const F={};const form=(job,task)=>F[job+'|'+task]??=({open:false,reasons:new Set(),parts:[],note:''});

function alertBox(msg){$('#alert').innerHTML=msg?`<div class="err" role="alert">${esc(msg)} <button class="btn small ghost" onclick="alertBox('')">Close</button></div>`:'';}
async function act(fn){try{alertBox('');await fn();await refresh(true);}catch(e){alertBox(e.message);await refresh(true);}}
async function refresh(force){
 try{const next=await api('/api/studio/state');const changed=JSON.stringify(next)!==JSON.stringify(S);S=next;
  // Never re-draw under the user's hands: while typing, or while a video or sound plays.
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||''),playing=[...document.querySelectorAll('video,audio')].some(m=>!m.paused);
  if(force||(changed&&!typing&&!playing))render();}
 catch(e){if(force)alertBox(e.message);}
}
setInterval(()=>{if(!document.hidden)refresh(false);},2500);
function go(t,job){tab=t;openJob=job??null;render();window.scrollTo(0,0);}

function render(){
 if(!S)return;const t=S.totals;
 $('#totals').innerHTML=`${t.waitingForYou?`<span class="pill hot"><b>${t.waitingForYou}</b> waiting for you</span>`:''}${t.waitingForAgent?`<span class="pill"><b>${t.waitingForAgent}</b> waiting for the agent</span>`:''}<span class="pill"><b>${t.jobs}</b> videos</span><span class="pill"><b>${S.scores.good}</b> good · <b>${S.scores.bad}</b> bad</span>`;
 $('#tabs').innerHTML=[['new','New video'],['jobs','Videos',S.jobs.length+S.requests.filter(r=>r.status==='waiting').length],['scores','Scores',S.scores.ratings]].map(([id,l,n])=>`<button role="tab" aria-selected="${tab===id}" onclick="go('${id}')">${l}${n!==undefined?`<span class="n">${n}</span>`:''}</button>`).join('');
 const y=window.scrollY;
 $('#main').innerHTML=tab==='new'?viewNew():tab==='scores'?viewScores():openJob&&S.jobs.find(j=>j.job===openJob)?viewJob(S.jobs.find(j=>j.job===openJob)):viewJobs();
 if(tab==='new')wireNew();
 window.scrollTo(0,y);
}

// ---------- new video ----------
const fileRow=(kind,label,hint,accept,multiple)=>{
 const mine=N.files.filter(f=>f.kind===kind);
 return `<label class="f">${label} <span class="muted">${hint}</span></label>
 <div class="pickfile"><button class="btn small" data-pick="${kind}">${mine.length&&!multiple?'Replace':'Choose file'+(multiple?'s':'')}</button>${N.busy&&N.busy.kind===kind?`<span class="muted small"><span class="spin"></span> ${esc(N.busy.text)}</span>`:''}
  <input type="file" hidden data-file="${kind}" accept="${accept}" ${multiple?'multiple':''}></div>
 ${mine.length?`<ul class="files">${mine.map(f=>`<li><span class="nm" dir="auto">${esc(f.name)}</span><span class="muted">${mb(f.bytes)}</span><button class="btn small ghost" data-rm="${esc(f.name)}" aria-label="Remove ${esc(f.name)}">✕</button></li>`).join('')}</ul>`:''}`;
};
function viewNew(){
 const m=N.mode==='motion',sel=(id,opts,val)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}"${String(val)===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
 return `<div class="modes">
  <button class="mode" aria-pressed="${m}" data-mode="motion"><b>Motion graphics video</b><span class="muted small">From a script, a prompt, a topic, or only a link. Everything is designed and animated for you.</span></button>
  <button class="mode" aria-pressed="${!m}" data-mode="edit"><b>Edit my footage</b><span class="muted small">Your talking-head or any video. Say what you want, or say nothing and the studio decides.</span></button>
 </div>
 <div class="form">
  <div class="card">
   ${m?`<h2>What is the video about?</h2>
    <label class="f" for="text">A script, a prompt or just a topic <span class="muted">(or leave empty and give only a link)</span></label>
    <textarea class="big" id="text" dir="auto" maxlength="12000" placeholder="For example: a 30 second ad for my coffee shop's new cold brew, playful, ends with our address.&#10;&#10;Or paste your finished script, one sentence a line.">${esc(N.text)}</textarea>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="script" ${N.script?'checked':''}> This is my finished script: use it word for word</label>
    <label class="f" for="link">Link <span class="muted">(a product page or article: read for facts and brand)</span></label>
    <input type="url" id="link" placeholder="https://" value="${esc(N.link)}">`
   :`<h2>Your footage</h2>
    ${fileRow('footage','Video to edit','(up to 8 files, '+S.can.maxMB+' MB each; they stay on this computer)','video/*,audio/*,.mkv,.mov',true)}
    <label class="f" for="text">What should the edit do? <span class="muted">(optional)</span></label>
    <textarea class="big" id="text" dir="auto" maxlength="12000" placeholder="Leave this empty and the studio decides everything: what to keep, the cuts, captions, music and visuals.&#10;&#10;Or say what you want: cut the pauses, make it 45 seconds, big bold captions, add my logo at the end.">${esc(N.text)}</textarea>`}
   <label class="f" for="notes">Anything else <span class="muted">(audience, mood, must-haves)</span></label>
   <textarea id="notes" dir="auto" maxlength="2000" style="min-height:70px">${esc(N.notes)}</textarea>
  </div>
  <div class="card">
   <h2>Details</h2>
   <div class="two"><div><label class="f" for="seconds">Length</label>${sel('seconds',[['','Studio decides'],['15','15 seconds'],['30','30 seconds'],['45','45 seconds'],['60','1 minute'],['90','1.5 minutes'],['120','2 minutes']],N.seconds)}</div>
    <div><label class="f" for="shape">Shape</label>${sel('shape',[['','Studio decides'],['vertical','Vertical 9:16'],['horizontal','Horizontal 16:9'],['square','Square 1:1']],N.shape)}</div></div>
   <label class="f" for="language">Language</label>${sel('language',LANGS,N.language)}
   ${m?`<label class="check" style="margin-top:12px"><input type="checkbox" id="voice" ${N.voice?'checked':''}> Add a voice-over (uses your ElevenLabs account)</label>
    <label class="check" style="margin-top:6px"><input type="checkbox" id="pick" ${N.pick?'checked':''}> Show me two looks and let me pick</label>`
   :`<label class="check" style="margin-top:12px"><input type="checkbox" id="captions" ${N.captions?'checked':''}> Captions</label>
    <label class="check" style="margin-top:6px"><input type="checkbox" id="visuals" ${N.visuals?'checked':''}> Designed visuals over the footage, where they help</label>`}
   ${fileRow('logo','Logo','(optional)','image/*,.svg',false)}
   <label class="check" style="margin-top:12px"><input type="checkbox" id="useColors" ${N.useColors?'checked':''}> Use these colours for this video</label>
   <div class="colors" style="margin-top:8px"${N.useColors?'':' hidden'}>${[['primary','Main'],['accent','Accent'],['background','Background']].map(([k,l])=>`<label><input type="color" id="c-${k}" value="${esc(N[k])}"> ${l}</label>`).join('')}</div>
   ${fileRow('reference','Reference','(a video or image to study, never copied)','video/*,image/*',true)}
   ${m&&S.taught.length?`<label class="f" for="like">In the spirit of a video you taught</label>${sel('like',[['','None'],...S.taught.map(v=>[v.id,esc(v.title.slice(0,60))])],N.like)}`:''}
   ${fileRow('asset','Other files','(photos, screenshots, music, a PDF)','image/*,video/*,audio/*,.pdf,.txt,.md',true)}
   <div class="row" style="margin-top:18px"><button class="btn primary" id="send" ${N.sending||N.busy?'disabled':''}>Send to the studio</button><button class="btn ghost" id="clear">Clear</button></div>
   <div class="muted small" style="margin-top:8px">Your agent makes the video in its terminal. You see and rate every step here.</div>
  </div>
 </div>`;
}
function wireNew(){
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{N.mode=b.dataset.mode;render();});
 for(const id of ['text','link','notes'])if($('#'+id))$('#'+id).oninput=e=>{N[id]=e.target.value;};
 for(const id of ['seconds','shape','language','like'])if($('#'+id))$('#'+id).onchange=e=>{N[id]=e.target.value;};
 for(const id of ['script','voice','pick','captions','visuals'])if($('#'+id))$('#'+id).onchange=e=>{N[id]=e.target.checked;};
 $('#useColors').onchange=e=>{N.useColors=e.target.checked;render();};
 for(const k of ['primary','accent','background'])$('#c-'+k).oninput=e=>{N[k]=e.target.value;};
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>$(`[data-file="${b.dataset.pick}"]`).click());
 document.querySelectorAll('[data-file]').forEach(i=>i.onchange=()=>uploadAll(i.dataset.file,[...i.files]));
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>act(async()=>{const r=await api(`/api/studio/requests/${N.id}/files?name=${encodeURIComponent(b.dataset.rm)}`,{method:'DELETE'});N.files=r.files;}));
 $('#clear').onclick=()=>act(async()=>{if(N.id)await api('/api/studio/requests/'+N.id,{method:'DELETE'}).catch(()=>0);N=blank();});
 $('#send').onclick=send;
}
async function ensure(){if(!N.id)N.id=(await api('/api/studio/requests',{method:'POST'})).id;return N.id;}
async function uploadAll(kind,files){
 try{alertBox('');const id=await ensure();
  if(kind==='logo')for(const f of N.files.filter(x=>x.kind==='logo'))N.files=(await api(`/api/studio/requests/${id}/files?name=${encodeURIComponent(f.name)}`,{method:'DELETE'})).files;
  for(const f of files){
   if(f.size>S.can.maxMB*1048576)throw new Error(`${f.name} is over ${S.can.maxMB} MB.`);
   N.busy={kind,text:'Uploading '+f.name};render();
   const r=await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',`/api/studio/requests/${id}/files?kind=${kind}&name=${encodeURIComponent(f.name)}`);x.setRequestHeader('x-teach-key',KEY);
    x.upload.onprogress=e=>{if(e.lengthComputable&&N.busy){N.busy.text=`Uploading ${f.name} ${Math.round(e.loaded/e.total*100)}%`;const el=document.querySelector('.pickfile .muted');if(el)el.lastChild.textContent=' '+N.busy.text;}};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText);}catch{}x.status===200?res(j):rej(new Error(j.error||'The upload failed'));};x.onerror=()=>rej(new Error('The upload failed. Is the server still running in the terminal?'));x.send(f);});
   N.files=r.files;}
 }catch(e){alertBox(e.message);}
 N.busy=null;render();
}
async function send(){
 if(N.sending)return;
 const body={mode:N.mode,text:N.text.trim(),script:N.mode==='motion'&&N.script,link:N.mode==='motion'?N.link.trim():'',voice:N.mode==='motion'&&N.voice,captions:N.captions,visuals:N.visuals,pick:N.mode==='motion'&&N.pick,
  colors:N.useColors?{primary:N.primary,accent:N.accent,background:N.background}:{},notes:N.notes.trim(),
  ...(N.seconds?{seconds:Number(N.seconds)}:{}),...(N.shape?{shape:N.shape}:{}),...(N.language?{language:N.language}:{}),...(N.mode==='motion'&&N.like?{like:N.like}:{})};
 if(N.mode==='motion'&&!body.text&&!body.link)return alertBox('Write a script, a prompt or a topic, or give a link.');
 if(N.mode==='edit'&&!N.files.some(f=>f.kind==='footage'))return alertBox('Choose the footage to edit.');
 N.sending=true;
 try{alertBox('');const id=await ensure();await api(`/api/studio/requests/${id}/submit`,{method:'POST',body:JSON.stringify(body)});N=blank();tab='jobs';openJob=null;await refresh(true);}
 catch(e){N.sending=false;alertBox(e.message);render();}
}

// ---------- videos ----------
const AGENT=`<b>Waiting for your agent.</b> In the agent's terminal, say “check the studio inbox”, or it can run: <code>pnpm tempoloom studio inbox</code>`;
function viewJobs(){
 const waiting=S.requests.filter(r=>r.status==='waiting');
 if(!waiting.length&&!S.jobs.length)return `<div class="empty"><h2>No videos yet</h2><p>Brief the first one in “New video”.</p></div>`;
 return `${waiting.length?`<div class="banner">${AGENT}</div>`:''}<div class="grid">
 ${waiting.map(r=>`<div class="card"><div class="row"><h3>${r.input.mode==='edit'?'Edit':'Motion video'}</h3><span class="badge wait">sent, not started</span><button class="btn small ghost" style="margin-left:auto" onclick="act(()=>api('/api/studio/requests/${r.id}',{method:'DELETE'}))">Remove</button></div>
   <div class="muted small" dir="auto" style="margin-top:6px">${esc(r.summary)}</div>${r.input.text?`<div dir="auto" style="margin-top:6px">${esc(r.input.text.slice(0,220))}${r.input.text.length>220?'…':''}</div>`:''}</div>`).join('')}
 ${S.jobs.map(j=>`<div class="card job" role="button" tabindex="0" onclick="go('jobs','${j.job}')" onkeydown="if(event.key==='Enter')go('jobs','${j.job}')">
   <div class="row"><h3 dir="auto">${esc(firstLine(j))}</h3><span class="badge st">${j.mode==='edit'?'edit':'motion'}</span>${stateBadge(j)}<span class="muted small" style="margin-left:auto">${j.done}/${j.of} steps</span></div>
   <div class="prog"><i style="width:${Math.round(j.done/j.of*100)}%"></i></div></div>`).join('')}</div>`;
}
const firstLine=j=>{const m=/(?:to use as written|write one\)|What the user wants):\n([^\n]+)/.exec(j.request);return (m?m[1]:j.request.split('\n')[0]).slice(0,90);};
const stateBadge=j=>j.finished?`<span class="badge good">${j.verdict?'finished':'done'}</span>`:j.waitingFor==='you'?'<span class="badge bad">waiting for you</span>':'<span class="badge wait">waiting for the agent</span>';
function viewJob(j){
 const final=j.tasks.find(t=>t.id==='final');
 return `<button class="btn small ghost" onclick="go('jobs')">← All videos</button>
 <div class="card" style="margin-top:12px"><div class="row"><h2 dir="auto">${esc(firstLine(j))}</h2>${stateBadge(j)}<span class="muted small" style="margin-left:auto">${j.done}/${j.of} steps</span></div>
  <div class="prog"><i style="width:${Math.round(j.done/j.of*100)}%"></i></div>
  <details><summary>The request</summary><div class="out" dir="auto">${esc(j.request)}</div></details></div>
 ${j.finished?'':j.waitingFor==='you'?`<div class="banner you"><b>Your turn.</b> Look at the steps below, rate them, then approve to continue.</div>`:`<div class="banner">${AGENT}${j.agentReady.length?`<div class="muted small" style="margin-top:4px">Ready for it: ${j.agentReady.map(esc).join(', ')}</div>`:''}</div>`}
 ${j.tasks.map(t=>t.gate?gateHtml(j,t):stepHtml(j,t,final)).join('')}
 ${j.feedback.length?`<h2 style="margin:22px 0 6px">Rules this video created</h2>${j.feedback.map(f=>`<div class="lesson"><div dir="auto">${esc(f.rule)}</div><div class="muted small">Sent to: ${f.goesTo.map(esc).join(', ')}</div></div>`).join('')}`:''}`;
}
const gateTitle=t=>t.title.replace(/^The user approves/,'Approve').replace(/^The user picks/,'Pick');
function gateHtml(j,t){
 if(t.status==='later')return '';
 if(t.status==='approved')return `<div class="step muted small">✓ ${esc(gateTitle(t))}: approved</div>`;
 const badSteps=j.tasks.filter(x=>!x.gate&&x.status==='redo').length;
 return `<div class="card step" style="border-color:var(--coral)"><div class="row"><h3>${esc(gateTitle(t))}</h3>
  <button class="btn primary" style="margin-left:auto" ${t.blockedBy.length?'disabled':''} onclick="act(()=>api('/api/studio/jobs/${j.job}/approve/${t.id}',{method:'POST',body:'{}'}))">Approve and continue</button></div>
  <div class="muted small" style="margin-top:6px">${t.blockedBy.length?'Pick a version above first.':'Rate the steps above first if you like. A step you rate bad is redone before this comes back.'}</div></div>`;
}
const mediaUrl=(j,t,slot)=>withKey(`/studio-file/job/${j.job}/${t.index}/${slot}`);
function stepHtml(j,t,final){
 const st={todo:'<span class="badge st">later</span>',doing:'<span class="badge wait"><span class="spin"></span> working</span>',done:'<span class="badge st">ready</span>',redo:'<span class="badge bad">being redone</span>'}[t.status];
 if(t.status==='todo')return `<div class="step todo muted small">○ ${esc(t.title)} · ${esc(t.owner)}</div>`;
 const f=form(j.job,t.id),isScript=/script\.txt$/.test(t.outputName||''),isFinal=t.id==='final';
 const flagged=p=>f.parts.some(x=>x.part===p);
 const vids=t.show.filter(s=>s.type==='video'),imgs=t.show.filter(s=>s.type==='image'),auds=t.show.filter(s=>s.type==='audio');
 const rateable=t.canRate&&!(isFinal&&j.verdict);
 return `<div class="card step" id="step-${t.id}">
  <div class="row"><h3>${esc(t.title)}</h3>${st}${t.round>1?`<span class="chip">version ${t.round}</span>`:''}<span class="muted small" style="margin-left:auto">${esc(t.owner)}</span></div>
  ${t.choices.length?`<div class="choices">${t.choices.map(c=>`<div class="choice ${t.picked===c.label?'picked':''}">${c.type==='video'?`<video controls preload="metadata" src="${mediaUrl(j,t,'choice-'+c.k)}"></video>`:c.type==='image'?`<img alt="${esc(c.label)}" src="${mediaUrl(j,t,'choice-'+c.k)}">`:''}
    <div class="row" style="margin-top:8px"><b dir="auto">${esc(c.label)}</b>${t.picked===c.label?'<span class="badge good">your pick</span>':t.picked?'':`<button class="btn small primary" style="margin-left:auto" onclick="act(()=>api('/api/studio/jobs/${j.job}/pick/${t.id}',{method:'POST',body:JSON.stringify({label:${esc(JSON.stringify(c.label))}})}))">Pick this one</button>`}</div></div>`).join('')}</div>`:''}
  ${vids.length?`<div class="media wide">${vids.map(s=>`<figure><video controls preload="metadata" id="vid-${t.id}-${s.k}" src="${mediaUrl(j,t,'show-'+s.k)}"></video><figcaption><span>${esc(s.name)}</span>${rateable?`<button class="btn small" onclick="flagMoment('${j.job}','${t.id}','vid-${t.id}-${s.k}')">Flag this moment</button>`:''}</figcaption></figure>`).join('')}</div>`:''}
  ${imgs.length?`<div class="media">${imgs.map((s,n)=>{const p='picture '+(n+1);return `<figure class="${flagged(p)?'flag':''}"><a href="${mediaUrl(j,t,'show-'+s.k)}" target="_blank" rel="noopener"><img loading="lazy" alt="${esc(s.name)}" src="${mediaUrl(j,t,'show-'+s.k)}"></a><figcaption><span>${n+1}. ${esc(s.name)}</span>${rateable?`<button class="btn small ${flagged(p)?'b on':''}" onclick="flagPart('${j.job}','${t.id}','${p}')">${flagged(p)?'Flagged':'Flag'}</button>`:''}</figcaption></figure>`;}).join('')}</div>`:''}
  ${auds.map(s=>`<div style="margin-top:10px"><div class="muted small">${esc(s.name)}</div><audio controls preload="none" src="${mediaUrl(j,t,'show-'+s.k)}"></audio></div>`).join('')}
  ${t.output!==null?(isScript?`<div class="out" dir="auto">${t.output.split('\n').map((l,n)=>l.trim()?`<span class="ln ${flagged('line '+(n+1))?'flag':''}" ${rateable?`onclick="flagPart('${j.job}','${t.id}','line ${n+1}')"`:''} title="${rateable?'Click to flag this line':''}">${esc(l)}</span>`:'<br>').join('')}</div>${rateable?'<div class="muted small">Click a line to flag it.</div>':''}`
   :`<details ${vids.length||imgs.length||t.choices.length?'':'open'}><summary>${esc(t.outputName||'What was decided')}</summary><div class="out" dir="auto">${esc(t.output)}</div></details>`):''}
  ${t.lessons.length?`<details><summary>${t.lessons.length} lesson${t.lessons.length>1?'s':''} this step used (your rating scores these)</summary>${t.lessons.map(l=>`<div class="lesson"><span class="badge ${l.status==='trial'?'wait':'st'}">${l.status==='trial'?'on trial':esc(l.status)}</span> <span dir="auto">${esc(l.title)}</span></div>`).join('')}</details>`:''}
  ${t.rating?`<div class="ratebar"><span class="badge ${t.rating.rating==='bad'?'bad':t.rating.rating==='good'?'good':'st'}">You rated it ${t.rating.rating==='ok'?'not bad':t.rating.rating}</span>${t.rating.rule?`<span class="muted small" dir="auto">Rule saved: ${esc(t.rating.rule)}</span>`:''}</div>`:''}
  ${t.earlier.length?`<div class="muted small" style="margin-top:6px">Earlier: ${t.earlier.map(e=>`version ${e.round} ${e.rating==='ok'?'not bad':e.rating}`).join(', ')}</div>`:''}
  ${rateable?`<div class="ratebar"><span class="muted small">${isFinal?'The finished video:':'This step:'}</span>
    <button class="btn small g" onclick="rateNow('${j.job}','${t.id}','good',${isFinal})">Good</button>
    <button class="btn small" onclick="rateNow('${j.job}','${t.id}','ok',${isFinal})">Not bad</button>
    <button class="btn small b ${f.open?'on':''}" onclick="toggleBad('${j.job}','${t.id}')">Bad</button>${f.parts.length&&!f.open?`<span class="muted small">${f.parts.length} flagged</span>`:''}</div>
   ${f.open?`<div class="why"><b class="small">What is wrong?</b>
    <div class="reasons">${S.reasons.map(r=>`<button class="btn small ${f.reasons.has(r.id)?'b on':''}" onclick="toggleReason('${j.job}','${t.id}','${r.id}')">${esc(r.label)}</button>`).join('')}</div>
    ${f.parts.length?`<ul class="parts">${f.parts.map((p,n)=>`<li><span class="p">${esc(p.part)}</span><input type="text" dir="auto" maxlength="300" placeholder="What is wrong here?" value="${esc(p.note)}" oninput="F['${j.job}|${t.id}'].parts[${n}].note=this.value" aria-label="What is wrong at ${esc(p.part)}"><button class="btn small ghost" onclick="F['${j.job}|${t.id}'].parts.splice(${n},1);render()" aria-label="Remove">✕</button></li>`).join('')}</ul>`:''}
    <textarea dir="auto" maxlength="600" placeholder="In your own words (optional if you chose a reason)" oninput="F['${j.job}|${t.id}'].note=this.value" style="min-height:64px">${esc(f.note)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn small primary" onclick="rateNow('${j.job}','${t.id}','bad',${isFinal})">Send: redo this step</button><span class="muted small">The reason is saved as a rule for the ${esc(t.owner)}, and only this step is redone.</span></div></div>`:''}`:''}
 </div>`;
}
window.toggleBad=(job,task)=>{const f=form(job,task);f.open=!f.open;render();};
window.toggleReason=(job,task,id)=>{const f=form(job,task);f.reasons.has(id)?f.reasons.delete(id):f.reasons.add(id);render();};
window.flagPart=(job,task,part)=>{const f=form(job,task),i=f.parts.findIndex(p=>p.part===part);i>=0?f.parts.splice(i,1):f.parts.push({part,note:''});if(f.parts.length)f.open=true;render();};
window.flagMoment=(job,task,vid)=>{const v=document.getElementById(vid);v.pause();const f=form(job,task),part='at '+fmtT(v.currentTime);if(!f.parts.some(p=>p.part===part))f.parts.push({part,note:''});f.open=true;render();};
window.rateNow=(job,task,rating,isFinal)=>act(async()=>{
 const f=form(job,task);
 const body={rating,reasons:rating==='bad'?[...f.reasons]:[],note:rating==='bad'?f.note.trim():'',parts:rating==='bad'?f.parts.map(p=>({part:p.part,rating:'bad',note:p.note.trim()})):[]};
 if(rating==='bad'&&!body.reasons.length&&!body.note&&!body.parts.some(p=>p.note))throw new Error('Say what is wrong: choose a reason or write a note.');
 await api(isFinal?`/api/studio/jobs/${job}/final`:`/api/studio/jobs/${job}/rate/${task}`,{method:'POST',body:JSON.stringify(body)});delete F[job+'|'+task];});

// ---------- scores ----------
function viewScores(){
 const s=S.scores;
 if(!s.ratings)return `<div class="empty"><h2>No ratings yet</h2><p>Rate the steps of a video and the scores appear here.</p></div>`;
 return `<p class="muted">Every rating scores only the lessons its step used: good ones gain confidence, bad ones lose it, and a lesson that keeps failing retires. <b>${s.good}</b> good and <b>${s.bad}</b> bad ratings across <b>${s.jobs}</b> videos.</p>
 <div class="card"><h3 style="margin-bottom:12px">By step</h3><div class="bars">${s.steps.map(x=>{const n=x.good+x.ok+x.bad;return `<span>${esc(x.step)}</span><span class="barx" role="img" aria-label="${x.good} good, ${x.ok} not bad, ${x.bad} bad"><i style="width:${x.good/n*100}%;background:var(--good)"></i><i style="width:${x.ok/n*100}%;background:var(--line)"></i><i style="width:${x.bad/n*100}%;background:var(--bad)"></i></span><span class="muted small">${x.good} good · ${x.bad} bad</span>`;}).join('')}</div></div>
 ${s.rules.length?`<h2 style="margin:22px 0 6px">Rules from your ratings</h2>${s.rules.map(r=>`<div class="lesson" dir="auto">${esc(r)}</div>`).join('')}`:''}`;
}
refresh(true);
</script>
</body>
</html>
