<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teach · Tempoloom</title>
<style>
@font-face{font-family:Fredoka;src:url(/font.ttf) format('truetype');font-weight:300 700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/font-ar.ttf) format('truetype');font-weight:100 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
:root{--bg:#062526;--panel:#0B3B3C;--raise:#114a4b;--line:#1d5b5c;--cream:#FFF1D6;--dim:#a9c4bd;--coral:#FF6B4A;--coral-ink:#3a1208;--good:#7fe0a8;--bad:#ff8f7a;--warn:#ffd27a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Fredoka,Vazirmatn,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header{display:flex;align-items:center;gap:18px;padding:18px 0 14px;flex-wrap:wrap}
header img{height:38px;display:block}
header .tag{color:var(--dim);font-size:.95rem}
.totals{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.88rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--cream);font-weight:600}
.pill.hot{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}.pill.hot b{color:var(--coral-ink)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--dim);font-weight:500;white-space:nowrap}
nav button[aria-selected=true]{color:var(--cream);border-color:var(--coral)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--raise);font-size:.78rem;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--coral-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.ghost{background:none}
.btn.on{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
input[type=text],input[type=url],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;min-height:92px}
label.f{display:block;font-size:.85rem;color:var(--dim);margin:14px 0 5px}
.muted{color:var(--dim)}.small{font-size:.88rem}
.err{background:#4a1a12;border:1px solid var(--bad);color:#ffd9d1;border-radius:10px;padding:10px 12px;margin:12px 0}

/* drop */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--coral);background:var(--panel)}
.drop h2{font-size:1.5rem;margin-bottom:6px}
.or{display:flex;gap:10px;margin-top:14px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .2s}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
@media(max-width:860px){.editor{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;display:flex;justify-content:center;touch-action:none}
.stage video{display:block;max-width:100%;max-height:62vh}
.crop{position:absolute;inset:0;display:none}.crop.on{display:block}
.crop .box{position:absolute;border:2px solid var(--coral);box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move}
.crop .h{position:absolute;width:18px;height:18px;background:var(--coral);border-radius:50%;margin:-9px}
.h.nw{left:0;top:0;cursor:nwse-resize}.h.ne{left:100%;top:0;cursor:nesw-resize}.h.sw{left:0;top:100%;cursor:nesw-resize}.h.se{left:100%;top:100%;cursor:nwse-resize}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.tools .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.9rem;margin-left:auto}
.track{position:relative;height:46px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;touch-action:none;user-select:none}
.track .sel{position:absolute;top:0;bottom:0;background:rgba(255,107,74,.22);border-left:3px solid var(--coral);border-right:3px solid var(--coral)}
.track .grip{position:absolute;top:0;bottom:0;width:16px;margin-left:-8px;cursor:ew-resize}
.track .head{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cream);pointer-events:none}
.track .mk{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;background:var(--warn);border-radius:50% 50% 50% 0;transform:rotate(-45deg);pointer-events:none}
.marks{list-style:none;padding:0;margin:10px 0 0}
.marks li{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.marks .t{font-variant-numeric:tabular-nums;color:var(--warn);min-width:54px;cursor:pointer}
.seg{display:flex;gap:6px}.seg button{flex:1}
.good.on{background:var(--good);border-color:var(--good);color:#06301a}
.badb.on{background:var(--bad);border-color:var(--bad);color:#3a0e06}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.topics label,.check{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:.92rem}
.topics label:has(input:checked){border-color:var(--coral)}
input[type=checkbox]{accent-color:var(--coral);width:17px;height:17px;flex:none}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font:inherit;font-size:.8rem}

/* lists */
.grid{display:grid;gap:14px}
.vid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media(max-width:600px){.vid{grid-template-columns:1fr}}
.thumb{width:120px;aspect-ratio:3/4;background:var(--bg);border-radius:10px;object-fit:cover;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:.78rem;border-radius:999px;padding:2px 10px;font-weight:600;white-space:nowrap}
.badge.good{background:var(--good);color:#06301a}.badge.bad{background:var(--bad);color:#3a0e06}
.badge.st{background:var(--raise);color:var(--dim);font-weight:500}.badge.wait{background:var(--warn);color:#3a2a00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:.84rem;color:var(--dim)}
.chip b{color:var(--cream);font-weight:500}
.lesson{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.lesson .body{margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.lesson.removed{opacity:.55}
.lesson.conflict{border-color:var(--warn)}
.say{background:var(--bg);border:1px dashed var(--warn);border-radius:10px;padding:12px;margin-top:10px}
.say code{display:block;margin-top:6px;color:var(--warn);font-family:ui-monospace,Consolas,monospace;font-size:.9rem;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--dim);font-size:.9rem;margin-top:10px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(255,255,255,.25)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
 <img src="/logo.svg" alt="Tempoloom" id="logo">
 <span class="tag">Teach the brain with videos</span>
 <div class="totals" id="totals"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<div id="alert"></div>
<main id="main"></main>
</div>
<script>
'use strict';
const KEY=new URLSearchParams(location.search).get('k')||'';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const withKey=u=>u+(u.includes('?')?'&':'?')+'k='+KEY;
async function api(path,opt={}){
 const r=await fetch(path,{...opt,headers:{'x-teach-key':KEY,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}});
 const j=await r.json().catch(()=>({error:'The server did not answer'}));
 if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
const fmtT=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(2).padStart(5,'0');};
let S=null,tab='teach',draft=null,ed=null,filter='all',busyUpload=null,linkInfo=null,editing=null;

function alertBox(msg){$('#alert').innerHTML=msg?`<div class="err" role="alert">${esc(msg)} <button class="btn small ghost" onclick="alertBox('')">Close</button></div>`:'';}
async function act(fn){try{alertBox('');await fn();await refresh(true);}catch(e){alertBox(e.message);}}

// ---------- state ----------
async function refresh(force){
 try{const next=await api('/api/state');const changed=JSON.stringify(next)!==JSON.stringify(S);S=next;if(changed||force)render(force);}
 catch(e){if(force)alertBox(e.message);}
}
setInterval(()=>{if(!document.hidden)refresh(false);},2000);

function render(force){
 if(!S)return;
 const t=S.totals;
 $('#totals').innerHTML=`${t.waiting?`<span class="pill hot"><b>${t.waiting}</b> waiting for the agent</span>`:''}
  <span class="pill"><b>${t.videos}</b> videos learned</span><span class="pill"><b>${t.kept}</b> lessons kept</span><span class="pill"><b>${t.onTrial}</b> on trial</span><span class="pill"><b>${t.patterns}</b> patterns</span>`;
 const tabs=[['teach','Teach a video'],['videos','Videos',S.videos.filter(v=>v.status!=='draft').length],['lessons','Lessons',t.lessons+(S.conflicts.length?' · '+S.conflicts.length+' to decide':'')],['patterns','Patterns',t.patterns]];
 $('#tabs').innerHTML=tabs.map(([id,l,n])=>`<button role="tab" aria-selected="${tab===id}" onclick="go('${id}')">${l}${n!==undefined?`<span class="n">${n}</span>`:''}</button>`).join('');
 // The editor is not re-drawn while the user is working in it.
 if(tab==='teach'){if(draft){if(!$('#editor'))renderEditor();}else if(!$('#drop')||(force&&!busyUpload&&!linkInfo))renderTeach();}
 else if(!(editing&&document.getElementById('edit-'+editing))){$('#main').innerHTML=tab==='videos'?viewVideos():tab==='lessons'?viewLessons():viewPatterns();}
}
function go(t){tab=t;editing=null;if(t!=='teach'&&ed)ed.video.pause();$('#main').innerHTML='';render();if(t==='teach')renderTeach();}

// ---------- teach tab ----------
function renderTeach(){
 const drafts=S.videos.filter(v=>v.status==='draft');
 if(!draft&&drafts.length&&!busyUpload){openDraft(drafts[0]);return;}
 if(draft){renderEditor();return;}
 $('#main').innerHTML=`
 <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a video">
  <h2>Drop a video here</h2>
  <div class="muted">or click to choose one · up to ${S.can.maxMB} MB · it stays on this computer and is deleted after learning</div>
  <div id="up"></div>
  <input type="file" id="file" accept="video/*,.mkv,.mov,.avi,.webm" hidden>
 </div>
 <div class="or"><input type="url" id="link" placeholder="…or paste a link to a video (YouTube, TikTok, Instagram…)" aria-label="Link to a video"><button class="btn" id="linkgo">Get it</button></div>
 <div id="linkbox"></div>
 <p class="muted small" style="margin-top:22px">How it works: you choose the part that matters, say what to learn and whether it is a good or a bad example. Tempoloom measures it, your agent looks at the frames and writes lessons, and the video is deleted. New lessons start on trial; you can keep, reword or remove each one.</p>`;
 const drop=$('#drop'),file=$('#file');
 drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
 file.onchange=()=>file.files[0]&&upload(file.files[0]);
 drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};drop.ondragleave=()=>drop.classList.remove('over');
 drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)upload(f);};
 $('#linkgo').onclick=()=>link(false);$('#link').onkeydown=e=>{if(e.key==='Enter')link(false);};
 if(busyUpload)showUpload();if(linkInfo)showLink();
}
function showUpload(){const u=$('#up');if(u&&busyUpload)u.innerHTML=`<div class="bar"><i style="width:${busyUpload.pct}%"></i></div><div class="muted small" style="margin-top:6px">${esc(busyUpload.text)}</div>`;}
function upload(f){
 if(busyUpload)return;
 if(f.size>S.can.maxMB*1048576)return alertBox(`This video is over ${S.can.maxMB} MB.`);
 alertBox('');busyUpload={pct:0,text:'Uploading '+f.name};showUpload();
 const x=new XMLHttpRequest();x.open('POST','/api/upload?name='+encodeURIComponent(f.name));x.setRequestHeader('x-teach-key',KEY);
 x.upload.onprogress=e=>{if(e.lengthComputable){busyUpload.pct=Math.round(e.loaded/e.total*100);if(busyUpload.pct>=100)busyUpload.text='Preparing the preview…';showUpload();}};
 x.onload=async()=>{busyUpload=null;let j={};try{j=JSON.parse(x.responseText);}catch{}
  if(x.status!==200){alertBox(j.error||'The upload failed');renderTeach();return;}
  await refresh(true);openDraft(j);};
 x.onerror=()=>{busyUpload=null;alertBox('The upload failed. Is the Teach server still running in the terminal?');renderTeach();};
 x.send(f);
}
async function link(confirm){
 const url=confirm?linkInfo.url:$('#link').value.trim();if(!url)return;
 try{alertBox('');linkInfo={url,busy:true,info:linkInfo&&linkInfo.info};showLink();
  const r=await api('/api/link',{method:'POST',body:JSON.stringify({url,confirm})});
  if(r.status==='needs-confirmation'){linkInfo={url,info:r.info};showLink();}
  else{linkInfo=null;await refresh(true);openDraft(r.video);}
 }catch(e){linkInfo=null;alertBox(e.message);renderTeach();}
}
function showLink(){const b=$('#linkbox');if(!b||!linkInfo)return;const i=linkInfo.info;
 b.innerHTML=`<div class="card" style="margin-top:12px">${linkInfo.busy?`<span class="spin"></span> ${i?'Downloading for study…':'Looking at the link…'}`:
  `<b dir="auto">${esc(i.title)}</b><div class="muted small">${esc(i.creator||'')} · ${i.seconds?fmtT(i.seconds):'?'} · about ${i.approxMB??'?'} MB · downloaded for study only, deleted after learning</div>
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="link(true)">Download and open</button><button class="btn ghost" onclick="linkInfo=null;renderTeach()">Cancel</button></div>`}</div>`;}

function openDraft(v){
 draft={id:v.id,name:v.title,fps:v.media.fps||30,seconds:v.media.seconds,w:v.media.width,h:v.media.height,audio:v.media.audio,
  title:v.title,verdict:'good',prompt:'',topics:new Set(),marks:[],start:0,end:v.media.seconds,crop:null,cropOn:false,sound:true,speech:false,aspect:'free',sending:false};
 tab='teach';render();renderEditor();
}
function renderEditor(){
 const d=draft;
 $('#main').innerHTML=`<div class="editor" id="editor">
 <div>
  <div class="stage" id="stage"><video id="v" src="${withKey('/media/'+d.id+'/preview.mp4')}" playsinline preload="auto"></video>
   <div class="crop" id="crop"><div class="box" id="box"><i class="h nw" data-h="nw"></i><i class="h ne" data-h="ne"></i><i class="h sw" data-h="sw"></i><i class="h se" data-h="se"></i></div></div></div>
  <div class="tools">
   <button class="btn" id="play" title="Play or pause (Space)">Play</button>
   <button class="btn small" id="back" title="One frame back (←)">◀ frame</button><button class="btn small" id="fwd" title="One frame forward (→)">frame ▶</button>
   <button class="btn small" id="speed" title="Playback speed">1×</button>
   <button class="btn small" id="loop" title="Repeat the chosen part">Loop</button>
   <span class="time" id="time"></span>
  </div>
  <div class="track" id="track" aria-label="Timeline"><div class="sel" id="sel"></div><div class="grip" id="g0" title="Start"></div><div class="grip" id="g1" title="End"></div><div id="mks"></div><div class="head" id="head"></div></div>
  <div class="tools">
   <button class="btn small" id="setin" title="Start the part to study here (I)">Start here</button>
   <button class="btn small" id="setout" title="End the part to study here (O)">End here</button>
   <button class="btn small" id="whole">Whole video</button>
   <span class="sep"></span>
   <button class="btn small" id="mark" title="Mark this moment (M)">＋ Mark this moment</button>
   <span class="sep"></span>
   <button class="btn small" id="cropbtn">Crop</button>
   <span id="aspects" hidden>${['free','9:16','1:1','16:9','4:5'].map(a=>`<button class="btn small" data-a="${a}">${a==='free'?'Free':a}</button>`).join(' ')}</span>
  </div>
  <div class="muted small" id="partinfo"></div>
  <ul class="marks" id="marks"></ul>
  <p class="muted small">Keys: <kbd>Space</kbd> play · <kbd>←</kbd> <kbd>→</kbd> one frame · <kbd>I</kbd> start · <kbd>O</kbd> end · <kbd>M</kbd> mark</p>
 </div>
 <div class="card">
  <h2>What should it learn?</h2>
  <label class="f" for="title">Name</label><input type="text" id="title" dir="auto" maxlength="120" value="${esc(d.title)}">
  <label class="f">This video is</label>
  <div class="seg"><button class="btn good" id="vgood">A good example</button><button class="btn badb" id="vbad">A bad example</button></div>
  <label class="f">Learn from its… <span class="muted">(only what you tick)</span></label>
  <div class="topics" id="topics">${S.topics.map(t=>`<label><input type="checkbox" value="${t.id}"${d.topics.has(t.id)?' checked':''}> ${esc(t.label)}</label>`).join('')}</div>
  <label class="f" for="prompt">Your prompt <span class="muted">(what to look at, what to ignore)</span></label>
  <textarea id="prompt" dir="auto" maxlength="2000" placeholder="For example: learn how the text enters and how fast the cuts are. Ignore the colours and the logo.">${esc(d.prompt)}</textarea>
  <label class="check" style="margin-top:10px"${d.audio?'':' hidden'}><input type="checkbox" id="sound" ${d.sound?'checked':''}> Study the sound too (music tempo, cuts on the beat)</label>
  <label class="check" style="margin-top:6px"${d.audio&&S.can.speech?'':' hidden'}><input type="checkbox" id="speech" ${d.speech?'checked':''}> Read the spoken words (uses your ElevenLabs account)</label>
  <div class="row" style="margin-top:18px"><button class="btn primary" id="send">Teach this video</button><button class="btn ghost" id="cancel">Remove</button></div>
  <div class="muted small" id="sendnote" style="margin-top:8px"></div>
 </div></div>`;
 setupEditor();
}

function setupEditor(){
 const d=draft,v=$('#v'),track=$('#track'),stage=$('#stage'),box=$('#box'),crop=$('#crop');
 const fps=d.fps;let loop=false;const speeds=[1,.5,.25,2];let sp=0;
 ed={video:v};
 const frac=t=>Math.max(0,Math.min(1,t/d.seconds));
 const paint=()=>{
  $('#sel').style.left=frac(d.start)*100+'%';$('#sel').style.width=(frac(d.end)-frac(d.start))*100+'%';
  $('#g0').style.left=frac(d.start)*100+'%';$('#g1').style.left=frac(d.end)*100+'%';$('#head').style.left=frac(v.currentTime)*100+'%';
  $('#time').textContent=fmtT(v.currentTime)+' / '+fmtT(d.seconds);
  $('#mks').innerHTML=d.marks.map(m=>`<i class="mk" style="left:${frac(m.t)*100}%"></i>`).join('');
  const whole=d.start<=.01&&d.end>=d.seconds-.01;
  $('#partinfo').textContent=(whole?'Studying the whole video':'Studying '+fmtT(d.start)+' to '+fmtT(d.end))+' ('+(d.end-d.start).toFixed(1)+' s)'+(d.cropOn&&d.crop?' · cropped to '+Math.round(d.crop.w*100)+'% × '+Math.round(d.crop.h*100)+'% of the frame':'');
  $('#vgood').classList.toggle('on',d.verdict==='good');$('#vbad').classList.toggle('on',d.verdict==='bad');
  $('#loop').classList.toggle('on',loop);$('#cropbtn').classList.toggle('on',d.cropOn);$('#aspects').hidden=!d.cropOn;
  document.querySelectorAll('#aspects button').forEach(b=>b.classList.toggle('on',b.dataset.a===d.aspect));
  $('#play').textContent=v.paused?'Play':'Pause';
 };
 const marks=()=>{$('#marks').innerHTML=d.marks.map((m,i)=>`<li><span class="t" data-go="${i}" title="Go to this moment">${fmtT(m.t)}</span><input type="text" dir="auto" maxlength="200" placeholder="What happens here? (for example: this transition)" value="${esc(m.note)}" data-note="${i}" aria-label="Note for the mark at ${fmtT(m.t)}"><button class="btn small ghost" data-del="${i}" aria-label="Remove this mark">✕</button></li>`).join('');};
 $('#marks').onclick=e=>{const g=e.target.dataset.go,x=e.target.dataset.del;if(g!==undefined){v.currentTime=d.marks[g].t;}if(x!==undefined){d.marks.splice(x,1);marks();paint();}};
 $('#marks').oninput=e=>{const n=e.target.dataset.note;if(n!==undefined)d.marks[n].note=e.target.value;};
 v.ontimeupdate=()=>{if(loop&&!v.paused&&(v.currentTime>=d.end||v.currentTime<d.start-.05))v.currentTime=d.start;paint();};
 v.onplay=v.onpause=v.onseeked=paint;
 v.onloadedmetadata=()=>{if(isFinite(v.duration)&&v.duration>0){d.seconds=v.duration;d.end=Math.min(d.end,v.duration)||v.duration;}paint();layoutCrop();};
 v.onerror=()=>alertBox('The preview could not be played. Remove it and upload the video again.');
 const toggle=()=>{if(v.paused){if(loop&&(v.currentTime>=d.end||v.currentTime<d.start))v.currentTime=d.start;v.play();}else v.pause();};
 $('#play').onclick=toggle;v.onclick=()=>{if(!d.cropOn)toggle();};
 const stepF=n=>{v.pause();v.currentTime=Math.max(0,Math.min(d.seconds,v.currentTime+n/fps));};
 $('#back').onclick=()=>stepF(-1);$('#fwd').onclick=()=>stepF(1);
 $('#speed').onclick=()=>{sp=(sp+1)%speeds.length;v.playbackRate=speeds[sp];$('#speed').textContent=speeds[sp]+'×';};
 $('#loop').onclick=()=>{loop=!loop;paint();};
 const setIn=()=>{d.start=Math.min(v.currentTime,d.end-.5);if(d.start<0)d.start=0;paint();},setOut=()=>{d.end=Math.max(v.currentTime,d.start+.5);if(d.end>d.seconds)d.end=d.seconds;paint();};
 const addMark=()=>{if(d.marks.length>=12)return alertBox('At most 12 marks.');d.marks.push({t:Math.round(v.currentTime*100)/100,note:''});d.marks.sort((a,b)=>a.t-b.t);marks();paint();};
 $('#setin').onclick=setIn;$('#setout').onclick=setOut;$('#whole').onclick=()=>{d.start=0;d.end=d.seconds;paint();};$('#mark').onclick=addMark;
 // timeline: click to seek, drag the grips to trim
 let drag=null;
 const at=e=>{const r=track.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*d.seconds;};
 track.onpointerdown=e=>{track.setPointerCapture(e.pointerId);drag=e.target.id==='g0'?'in':e.target.id==='g1'?'out':'seek';move(e);};
 const move=e=>{if(!drag)return;const t=at(e);if(drag==='in')d.start=Math.max(0,Math.min(t,d.end-.5));else if(drag==='out')d.end=Math.min(d.seconds,Math.max(t,d.start+.5));v.currentTime=drag==='out'?d.end:drag==='in'?d.start:t;paint();};
 track.onpointermove=move;track.onpointerup=track.onpointercancel=()=>{drag=null;};
 // crop: a box over the picture, kept as fractions of the frame
 const rect=()=>{const s=stage.getBoundingClientRect(),r=v.getBoundingClientRect();return {l:r.left-s.left,t:r.top-s.top,w:r.width,h:r.height};};
 function layoutCrop(){crop.classList.toggle('on',d.cropOn);if(!d.cropOn||!d.crop)return;const r=rect();
  Object.assign(box.style,{left:r.l+d.crop.x*r.w+'px',top:r.t+d.crop.y*r.h+'px',width:d.crop.w*r.w+'px',height:d.crop.h*r.h+'px'});}
 const ratio=()=>{if(d.aspect==='free')return null;const [a,b]=d.aspect.split(':').map(Number);return (a/b)/(d.w/d.h);}; // box w/h in fractions
 const fit=()=>{const k=ratio();if(!k)return;let w=d.crop.w,h=w/k;if(h>1){h=1;w=k;}if(w>1){w=1;h=1/k;}const cx=d.crop.x+d.crop.w/2,cy=d.crop.y+d.crop.h/2;
  d.crop={w,h,x:Math.max(0,Math.min(1-w,cx-w/2)),y:Math.max(0,Math.min(1-h,cy-h/2))};};
 $('#cropbtn').onclick=()=>{d.cropOn=!d.cropOn;if(d.cropOn&&!d.crop){d.crop={x:.1,y:.1,w:.8,h:.8};fit();}v.pause();paint();layoutCrop();};
 $('#aspects').onclick=e=>{const a=e.target.dataset.a;if(!a)return;d.aspect=a;if(a==='free')d.crop={x:.1,y:.1,w:.8,h:.8};else{d.crop={x:0,y:0,w:1,h:1};fit();}paint();layoutCrop();};
 let cd=null;
 box.onpointerdown=e=>{e.preventDefault();box.setPointerCapture(e.pointerId);cd={h:e.target.dataset.h||'move',x:e.clientX,y:e.clientY,c:{...d.crop}};};
 box.onpointermove=e=>{if(!cd)return;const r=rect(),dx=(e.clientX-cd.x)/r.w,dy=(e.clientY-cd.y)/r.h,c=cd.c,k=ratio(),min=.1;let x=c.x,y=c.y,w=c.w,h=c.h;
  if(cd.h==='move'){x=Math.max(0,Math.min(1-w,c.x+dx));y=Math.max(0,Math.min(1-h,c.y+dy));}
  else{const L=cd.h.includes('w'),Tp=cd.h.includes('n');
   let x0=L?Math.max(0,Math.min(c.x+c.w-min,c.x+dx)):c.x,x1=L?c.x+c.w:Math.max(c.x+min,Math.min(1,c.x+c.w+dx));
   let y0=Tp?Math.max(0,Math.min(c.y+c.h-min,c.y+dy)):c.y,y1=Tp?c.y+c.h:Math.max(c.y+min,Math.min(1,c.y+c.h+dy));
   w=x1-x0;h=y1-y0;
   if(k){h=w/k;if(Tp?(y1-h<0):(y0+h>1)){h=Tp?y1:1-y0;w=h*k;}if(Tp)y0=y1-h;else y1=y0+h;if(L)x0=x1-w;}
   x=x0;y=y0;}
  d.crop={x,y,w,h};layoutCrop();paint();};
 box.onpointerup=box.onpointercancel=()=>{cd=null;};
 new ResizeObserver(layoutCrop).observe(stage);
 // the form
 $('#title').oninput=e=>d.title=e.target.value;$('#prompt').oninput=e=>d.prompt=e.target.value;
 $('#vgood').onclick=()=>{d.verdict='good';paint();};$('#vbad').onclick=()=>{d.verdict='bad';paint();};
 $('#topics').onchange=e=>{e.target.checked?d.topics.add(e.target.value):d.topics.delete(e.target.value);};
 $('#sound').onchange=e=>{d.sound=e.target.checked;};$('#speech').onchange=e=>{d.speech=e.target.checked;};
 $('#cancel').onclick=()=>act(async()=>{v.pause();await api('/api/videos/'+d.id,{method:'DELETE'});draft=null;ed=null;});
 $('#send').onclick=async()=>{
  if(d.sending)return;
  if(!d.title.trim())return alertBox('Give the video a name.');
  if(!d.topics.size)return alertBox('Tick at least one thing to learn from this video.');
  const whole=d.start<=.01&&d.end>=d.seconds-.01,c=d.cropOn&&d.crop&&(d.crop.w<.995||d.crop.h<.995)?d.crop:null;
  const body={title:d.title.trim(),verdict:d.verdict,prompt:d.prompt.trim(),topics:[...d.topics],marks:d.marks.filter(m=>whole||m.t>=d.start&&m.t<=d.end).map(m=>({t:m.t,note:m.note.trim()})),
   segment:whole?null:{start:Math.round(d.start*1000)/1000,end:Math.round(d.end*1000)/1000},crop:c?{x:c.x,y:c.y,w:c.w,h:c.h}:null,sound:d.audio&&d.sound,speech:d.audio&&d.sound&&d.speech};
  d.sending=true;$('#send').disabled=true;
  try{alertBox('');v.pause();await api('/api/videos/'+d.id+'/teach',{method:'POST',body:JSON.stringify(body)});draft=null;ed=null;tab='videos';await refresh(true);}
  catch(e){d.sending=false;$('#send').disabled=false;alertBox(e.message);}
 };
 marks();paint();
}
document.addEventListener('keydown',e=>{
 if(tab!=='teach'||!draft||!ed||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 const k=e.key.toLowerCase(),b={' ':'#play',arrowleft:'#back',arrowright:'#fwd',i:'#setin',o:'#setout',m:'#mark'}[k];
 if(b){e.preventDefault();$(b).click();}
});

// ---------- videos tab ----------
const lessonHtml=(l,ctx='')=>{
 const st=l.status==='trial'?'<span class="badge wait">on trial</span>':l.status==='rejected'||l.status==='retired'?'<span class="badge st">removed</span>':`<span class="badge good">${l.status==='proven'?'proven':'kept'}</span>`;
 const id=esc(l.id),key=ctx+l.id;
 if(editing===key)return `<div class="lesson" id="edit-${esc(key)}"><textarea id="et" dir="auto" maxlength="1500">${esc(l.body)}</textarea><div class="row" style="margin-top:8px"><button class="btn small primary" onclick="saveEdit('${id}')">Save and keep</button><button class="btn small ghost" onclick="editing=null;render()">Cancel</button></div></div>`;
 return `<div class="lesson ${l.status==='rejected'||l.status==='retired'?'removed':''} ${l.conflictWith&&l.status==='trial'?'conflict':''}">
  <div class="row">${st}${l.kind==='avoid'?'<span class="badge bad">avoid</span>':''}${l.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}
   <span class="muted small" style="margin-left:auto">${l.videos>1?`seen in ${l.videos} videos · `:''}${l.uses?`used in ${l.uses} job${l.uses>1?'s':''} · `:''}confidence ${l.confidence}%</span></div>
  <div class="body" dir="auto">${esc(l.body)}</div>
  <div class="row">${l.status==='trial'?`<button class="btn small" onclick="lesson('${id}','${l.conflictWith?'both':'keep'}')">Keep</button>`:''}
   ${l.status==='rejected'||l.status==='retired'?`<button class="btn small" onclick="lesson('${id}','both')">Bring back</button>`:`<button class="btn small ghost" onclick="editing='${esc(key)}';render()">Reword</button><button class="btn small ghost" onclick="lesson('${id}','remove')">Remove</button>`}</div></div>`;
};
window.lesson=(id,action)=>act(()=>api('/api/lessons/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action})}));
window.saveEdit=id=>act(async()=>{const body=$('#et').value;await api('/api/lessons/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action:'edit',body,title:body.split(/(?<=[.!?])\s/)[0].slice(0,100)})});editing=null;});
const word=(n,a)=>a.find(([max])=>n<max)[1];
function chips(m,speech){
 if(!m)return '';const c=[];
 c.push(`<b>${fmtT(m.media.seconds)}</b> ${m.media.shape}`);
 c.push(m.pacing.cuts>=2?`shots <b>${m.pacing.shotMedian} s</b> · ${m.pacing.cutsPerMinute} cuts/min`:'<b>one continuous piece</b>');
 if(m.pacing.firstCut!=null)c.push(`first cut at <b>${m.pacing.firstCut} s</b>`);
 c.push(`motion <b>${word(m.motion.energy,[[1,'calm'],[2.5,'gentle'],[5,'lively'],[1e9,'very busy']])}</b> (${m.motion.energy}) · still ${Math.round(m.motion.stillShare*100)}%`);
 c.push(`<span class="swatch" style="background:${esc(m.color.background)}"></span>${m.color.accent?` <span class="swatch" style="background:${esc(m.color.accent)}"></span>`:''} <b>${word(m.color.brightness,[[.3,'dark'],[.7,'mid'],[9,'light']])}</b>, ${word(m.color.saturation,[[.2,'muted'],[.5,'coloured'],[9,'vivid']])}`);
 if(m.sound){if(m.sound.tempoConfidence>=.25)c.push(`<b>${m.sound.bpm} BPM</b>`);if(m.sound.cutsOnBeat!=null)c.push(`<b>${Math.round(m.sound.cutsOnBeat*100)}%</b> of cuts on the beat (chance ${Math.round(m.sound.cutsOnBeatByChance*100)}%)`);if(m.sound.lufs!=null)c.push(`${m.sound.lufs} LUFS`);}
 if(speech)c.push(`<b>${speech.wordsPerSecond}</b> words/s · ${speech.hookWords} words in the first 3 s`);
 return `<div class="chips">${c.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
}
function viewVideos(){
 const vs=S.videos.filter(v=>v.status!=='draft');
 if(!vs.length)return `<div class="empty"><h2>No videos taught yet</h2><p>Teach the first one in the “Teach a video” tab.</p></div>`;
 return `<div class="grid">${vs.map(v=>{
  const id=esc(v.id);
  const status=v.status==='measuring'?`<span class="badge st"><span class="spin"></span> ${esc(v.step||'Measuring')}…</span>`:v.status==='waiting'?'<span class="badge wait">waiting for the agent</span>':v.status==='failed'?'<span class="badge bad">failed</span>':'<span class="badge st">learned · video deleted</span>';
  return `<div class="card vid">
   <div>${v.hasThumb?`<img class="thumb" alt="" src="${withKey('/media/'+id+'/thumb.jpg')}">`:'<div class="thumb"></div>'}</div>
   <div>
    <div class="row"><h3 dir="auto">${esc(v.title)}</h3><span class="badge ${v.verdict}">${v.verdict==='good'?'good example':'bad example'}</span>${status}</div>
    <div class="muted small" style="margin-top:4px">Learning: ${v.topics.map(esc).join(', ')||'—'}${v.prompt?` · <span dir="auto">“${esc(v.prompt.slice(0,160))}${v.prompt.length>160?'…':''}”</span>`:''}</div>
    ${v.error?`<div class="err">${esc(v.error)}</div>`:''}
    ${chips(v.measured,v.speech)}
    ${v.status==='waiting'?`<div class="say"><b>Your agent has not looked at it yet.</b> In the agent's terminal, say “study the videos I taught”, or it can run:<code>pnpm tempoloom teach next</code>
      <div class="muted small" style="margin-top:6px">The video is kept in a temporary folder until then. ${v.lessons.length?'':'You can also finish now: only the measurements are learned, and the video is deleted.'}</div></div>`:''}
    ${v.lessons.length?`<div style="margin-top:10px"><b class="small">Lessons from this video</b>${v.lessons.map(l=>lessonHtml(l,v.id+'|')).join('')}</div>`:v.status==='learned'?'<div class="muted small">No written lessons; its measurements still count towards the patterns.</div>':''}
    ${v.dropped.length?`<details><summary>${v.dropped.length} lesson${v.dropped.length>1?'s':''} filtered out as noise</summary>${v.dropped.map(x=>`<div class="lesson removed"><div class="body" dir="auto">${esc(x.text)}</div><div class="muted small">${esc(x.reason)}</div></div>`).join('')}</details>`:''}
    ${v.similar.length?`<div class="muted small" style="margin-top:10px">Most like: ${v.similar.map(s=>`<b dir="auto">${esc(s.title)}</b> ${s.alike}% (${s.mostAlikeIn.map(esc).join(', ')})`).join(' · ')}</div>`:''}
    <div class="row" style="margin-top:12px">
     ${v.status==='waiting'?`<button class="btn small" onclick="finishNow('${id}')">Finish now and delete the video</button>`:''}
     ${v.status!=='measuring'?`<button class="btn small ghost" onclick="forget('${id}','${v.status}')">${v.status==='learned'?'Forget this video':'Remove'}</button>`:''}
    </div>
   </div></div>`;}).join('')}</div>`;
}
window.finishNow=id=>act(()=>api('/api/videos/'+id+'/finish',{method:'POST'}));
window.forget=(id,status)=>{if(status==='learned'&&!confirm('Forget this video? Its measurements go, and the lessons that came only from it and were never used.'))return;act(()=>api('/api/videos/'+id,{method:'DELETE'}));};

// ---------- lessons tab ----------
function viewLessons(){
 const all=[...new Map(S.videos.flatMap(v=>v.lessons).map(l=>[l.id,l])).values()];
 if(!all.length)return `<div class="empty"><h2>No lessons yet</h2><p>Lessons appear here after your agent studies a taught video.</p></div>`;
 const topics=['all',...S.topics.map(t=>t.id).filter(t=>all.some(l=>l.topics.includes(t)))];
 const show=all.filter(l=>filter==='all'||l.topics.includes(filter));
 const group=(title,note,list)=>list.length?`<h2 style="margin:22px 0 4px">${title} <span class="muted small">${list.length}</span></h2><div class="muted small">${note}</div>${list.map(l=>lessonHtml(l,'L|')).join('')}`:'';
 const conflictIds=new Set(S.conflicts.map(c=>c.lesson.id));
 return `<div class="filter">${topics.map(t=>`<button class="btn small ${filter===t?'on':''}" onclick="filter='${t}';render()">${t==='all'?'All':esc(S.topics.find(x=>x.id===t).label)}</button>`).join('')}</div>
 ${S.conflicts.length?`<h2 style="margin:6px 0 4px">To decide <span class="muted small">${S.conflicts.length}</span></h2><div class="muted small">A new lesson says the opposite of something already known. Choose which one stays.</div>
  ${S.conflicts.map(c=>`<div class="card" style="margin-top:10px;border-color:var(--warn)">
   <div class="muted small">New, from a taught video</div><div dir="auto" style="margin:4px 0 10px">${esc(c.lesson.body)}</div>
   <div class="muted small">Already known</div><div dir="auto" style="margin:4px 0 12px">${esc(c.against.body)}</div>
   <div class="row"><button class="btn small" onclick="lesson('${esc(c.lesson.id)}','keep')">Keep the new one</button><button class="btn small" onclick="lesson('${esc(c.lesson.id)}','remove')">Keep what was known</button><button class="btn small ghost" onclick="lesson('${esc(c.lesson.id)}','both')">Keep both</button></div></div>`).join('')}`:''}
 ${group('On trial','New lessons. The agent tries them when they fit; two approved jobs make one proven. Keep the ones you agree with now.',show.filter(l=>l.status==='trial'&&!conflictIds.has(l.id)))}
 ${group('Kept','Applied to new videos whenever they fit.',show.filter(l=>l.status==='approved'||l.status==='proven'))}
 ${group('Removed','Never applied, and never learned again from another video.',show.filter(l=>l.status==='rejected'||l.status==='retired'))}`;
}

// ---------- patterns tab ----------
function viewPatterns(){
 const p=S.patterns;
 return `<p class="muted">What your good examples have in common, from their measurements. A pattern needs at least three good examples that agree; a video far from the rest is left out. From <b>${p.from.good}</b> good and <b>${p.from.bad}</b> bad examples so far.</p>
 ${p.found.length?`<div class="grid">${p.found.map(x=>`<div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="chip">${esc(x.topic)}</span></div><div style="margin-top:6px">${esc(x.body)}</div></div>`).join('')}</div>`
  :`<div class="empty"><h2>No patterns yet</h2><p>${p.from.good<3?`Teach ${3-p.from.good} more good example${3-p.from.good>1?'s':''} on the same topic to see the first pattern.`:'Your good examples do not agree closely enough yet.'}</p></div>`}
 ${p.unclear.length?`<details><summary>${p.unclear.length} measurement${p.unclear.length>1?'s':''} your examples disagree on</summary>${p.unclear.map(u=>`<div class="lesson removed"><b>${esc(u.metric)}</b><div class="muted small">${esc(u.why)}</div></div>`).join('')}</details>`:''}`;
}
refresh(true);
</script>
</body>
</html>
